<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sight Words</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-common-path="../common">
    <a href="../index.html" class="home-btn" aria-label="Go to home page">Home</a>
    <div id="sidebar" class="sidebar closed">
        <button id="close-sidebar" class="sidebar-close">&times;</button>
        <div class="sidebar-title">Sight Words</div>
        <div class="difficulty-selector">
            <label for="difficulty-select">Level:</label>
            <select id="difficulty-select" class="difficulty-select">
                <option value="1">Level 1 (3 letters)</option>
                <option value="2">Level 2 (4 letters)</option>
                <option value="3">Level 3 (5 letters)</option>
            </select>
        </div>
        <button id="start-btn" class="sidebar-tab active">Start</button>
    </div>
    <button id="open-sidebar" class="sidebar-toggle">&#9776;</button>
    <div class="quiz-container">
        <div id="question-number" class="question-number"></div>
        <div class="sight-word-row">
            <div id="sight-word" class="sight-word"></div>
            <button type="button" id="sound-btn" class="sound-btn" aria-label="Play word sound" title="Play word">
                <svg class="sound-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
        </div>
        <div id="feedback" class="feedback"></div>
        <button id="next-btn" class="next-btn" style="display:none;">Next word</button>
        <button id="restart-btn" class="restart-btn" style="display:none;">Restart</button>
    </div>
    <script src="app.js"></script>
    <script src="../common/random-background.js"></script>
</body>
</html>
