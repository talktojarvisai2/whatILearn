<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scramble Words Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-common-path="../Common">
    <a href="../index.html" class="home-btn" aria-label="Go to home page">Home</a>
    <div id="sidebar" class="sidebar closed">
        <button id="close-sidebar" class="sidebar-close">&times;</button>
        <div class="sidebar-title">Menu</div>
        <div class="difficulty-selector">
            <label for="difficulty-select">Difficulty Level:</label>
            <select id="difficulty-select" class="difficulty-select">
                <option value="1">Level 1 (3 letters)</option>
                <option value="2">Level 2 (4 letters)</option>
                <option value="3">Level 3 (5 letters)</option>
            </select>
        </div>
        <button id="tab-scramble" class="sidebar-tab active">Scramble Words</button>
    </div>
    <button id="open-sidebar" class="sidebar-toggle">&#9776;</button>
    <div class="game-container">
        <div id="question-number" class="question-number"></div>
        <div id="scrambled-word" class="scrambled-word"></div>
        <div id="tries-left" class="tries-left"></div>
        <div id="feedback" class="feedback"></div>
        <div id="score" class="score"></div>
        <div id="input-section" class="input-section">
            <input type="text" id="answer-input" class="answer-input" placeholder="Type your answer..." maxlength="5">
            <button id="submit-btn" class="submit-btn">Submit</button>
        </div>
        <button id="next-btn" class="next-btn" style="display:none;">Next</button>
        <button id="restart-btn" class="restart-btn" style="display:none;">Restart</button>
    </div>
    <div id="fireworks-overlay" style="display:none;"></div>
    <div id="motivational-quote" class="motivational-quote" style="display:none;"></div>
    <script src="app.js"></script>
    <script src="../Common/random-background.js"></script>
</body>
</html>
